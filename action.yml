name: 'GitHub Profile Visualizer'
description: 'All-in-one developer profile visualizer: 3D contribution city, coding habits, recent activity stream, languages matrix, and LeetCode cards'
author: 'Tharun4743'

inputs:
  username:
    description: 'Target GitHub username'
    required: false
    default: ${{ github.repository_owner }}
  visualizers:
    description: 'Visualizers to generate: "all" or comma-separated list ("3d-city,activity,habits,languages,leetcode")'
    required: false
    default: 'all'
  theme:
    description: 'Color theme: cyberpunk, tokyonight, dracula, nord, matrix, synthwave, monokai, sunset, github-dark, github-light'
    required: false
    default: 'cyberpunk'
  custom-colors:
    description: 'Optional comma-separated list of 5 hex colors for levels 0 to 4 (e.g. "#161b22,#0e4429,#006d32,#26a641,#39d353")'
    required: false
    default: ''
  custom-bg:
    description: 'Optional canvas background hex color'
    required: false
    default: ''
  title:
    description: 'Custom header title for the 3D city'
    required: false
    default: ''
  hide-header:
    description: 'Whether to hide the top header and telemetry counters in the 3D city (true/false)'
    required: false
    default: 'false'
  hide-legend:
    description: 'Whether to hide the bottom activity legend (true/false)'
    required: false
    default: 'false'
  animate:
    description: 'Whether to enable pulsing neon light reflection animations across towers (true/false)'
    required: false
    default: 'true'
  height-scale:
    description: 'Multiplier for 3D tower elevation (e.g. 1.0, 1.5, 2.0)'
    required: false
    default: '1.0'
  year:
    description: 'Year to fetch contributions for (e.g. 2025) or "last-year"'
    required: false
    default: 'last-year'
  leetcode-username:
    description: 'LeetCode username for problem solving telemetry (defaults to GitHub username)'
    required: false
    default: ''
  output-dir:
    description: 'Target directory where generated SVG files will be saved'
    required: false
    default: 'assets'
  filename:
    description: 'Filename for primary 3D city SVG'
    required: false
    default: 'profile-3d-city.svg'
  generate-all:
    description: 'Whether to generate all 10 theme variants of the 3D city (true/false)'
    required: false
    default: 'false'
  token:
    description: 'GitHub token (e.g. secrets.GITHUB_TOKEN) for API queries'
    required: false
    default: ${{ github.token }}

outputs:
  svg-path:
    description: 'Path to generated 3D City SVG'
  activity-svg-path:
    description: 'Path to generated Recent Activity SVG'
  habits-svg-path:
    description: 'Path to generated Coding Habits SVG'
  languages-svg-path:
    description: 'Path to generated Language Matrix SVG'
  leetcode-svg-path:
    description: 'Path to generated LeetCode Telemetry SVG'
  total-contributions:
    description: 'Total number of contributions found'
  active-days:
    description: 'Total number of active contribution days'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'activity'
  color: 'purple'
